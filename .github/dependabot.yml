# The site is still being built and is not live, so routine version-update PRs
# are noise nobody will read — and unread PRs train you to ignore Dependabot,
# which is exactly how the 2026-08-16 advisory backlog went unnoticed.
#
# `open-pull-requests-limit: 0` disables *version* updates only. Dependabot
# SECURITY updates are a separate repository feature (Settings → Code security →
# "Dependabot security updates", enabled 2026-08-16) and are NOT capped by this
# limit, so vulnerability fixes still arrive as PRs.
#
# Raise these limits for a deliberate dependency-refresh pass, and before go-live.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
    # next and eslint-config-next are pinned exactly and must move together;
    # a PR that bumps only one of them will fail lint.
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
    ignore:
      # React is pinned to the exact version the Next release line expects.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
